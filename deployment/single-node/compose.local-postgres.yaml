services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    profiles: [local-postgres]
    environment:
      POSTGRES_DB: audorix
      POSTGRES_USER: audorix_runtime
      POSTGRES_PASSWORD: ${AUDORIX_LOCAL_POSTGRES_PASSWORD:?external secret required}
    volumes: [audorix_postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U audorix_runtime -d audorix]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  audorix_postgres:
