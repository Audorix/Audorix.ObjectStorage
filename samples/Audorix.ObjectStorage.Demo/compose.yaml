services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audorix_demo
      POSTGRES_USER: audorix_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audorix_demo -d audorix_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  demo:
    build:
      context: ../..
      dockerfile: samples/Audorix.ObjectStorage.Demo/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ObjectStorage: Host=postgres;Port=5432;Database=audorix_demo;Username=audorix_demo;Password=local-demo-only
      ObjectStorage__RootPath: /var/lib/audorix/objects
      S3__AccessKeyId: local-demo-key
      S3__SecretAccessKey: local-demo-secret-change-before-use
      S3__TokenSigningKey: local-demo-token-signing-key-at-least-32-bytes
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - object-data:/var/lib/audorix/objects
volumes:
  postgres-data:
  object-data:
